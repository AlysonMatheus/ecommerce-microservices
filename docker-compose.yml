services:
  rabbitmq:
    image: rabbitmq:3.13-management
    ports: ["5672:5672", "15672:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  order-db:
    image: postgres:16
    environment: { POSTGRES_DB: order, POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres }
    ports: ["5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  inventory-db:
    image: postgres:16
    environment: { POSTGRES_DB: inventory, POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres }
    ports: ["5434:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  order-service:
    build: { context: ., dockerfile: order-service/Dockerfile }
    ports: ["8081:8081"]
    environment:
      DB_URL: jdbc:postgresql://order-db:5432/order
      RABBIT_HOST: rabbitmq
    depends_on:
      order-db: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  inventory-service:
    build: { context: ., dockerfile: inventory-service/Dockerfile }
    ports: ["8082:8082"]
    environment:
      DB_URL: jdbc:postgresql://inventory-db:5432/inventory
      RABBIT_HOST: rabbitmq
    depends_on:
      inventory-db: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  notification-service:
    build: { context: ., dockerfile: notification-service/Dockerfile }
    ports: ["8083:8083"]
    environment:
      RABBIT_HOST: rabbitmq
    depends_on:
      rabbitmq: { condition: service_healthy }
